<div class="input-container" [ngClass]="styles">
  <label class="input-label" *ngIf="label" [for]="id"
    >{{ label }} <span *ngIf="required">*</span>
  </label>
  <input
    class="input-field"
    [id]="id"
    [type]="type"
    [placeholder]="placeholder"
    [ngClass]="styles"
    [formControl]="control"
  />

  <small class="error" *ngIf="showError">{{ errorText }}</small>
</div>
